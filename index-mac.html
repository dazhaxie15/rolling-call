<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级随机点名精灵 - 3D特效版 (Mac专用)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
      color: white;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 100;
      text-align: center;
    }

    .header h1 {
      color: #4ecdc4;
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      border-radius: 15px;
      border: 1px solid rgba(78, 205, 196, 0.3);
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }

    .count-selector {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .count-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(78, 205, 196, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .count-btn:hover {
      border-color: #4ecdc4;
      background: rgba(78, 205, 196, 0.2);
    }

    .count-btn.active {
      background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
      border-color: #4ecdc4;
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    .result-display {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px 40px;
      border: 2px solid #4ecdc4;
      box-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
      display: none;
    }

    .result-display.show {
      display: block;
    }

    .result-title {
      font-size: 24px;
      font-weight: bold;
      color: #4ecdc4;
      text-align: center;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(78, 205, 196, 0.8);
    }

    .result-list {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .result-item {
      font-size: 20px;
      font-weight: bold;
      color: white;
      padding: 10px 20px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(78, 205, 196, 0.3);
    }

    .instructions h2 {
      color: #4ecdc4;
      margin-bottom: 20px;
    }

    .instructions p {
      color: #aaa;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .input-area {
      margin-top: 20px;
    }

    .input-area textarea {
      width: 400px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(78, 205, 196, 0.3);
      border-radius: 10px;
      padding: 15px;
      color: white;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }

    .file-upload-area {
      margin-top: 20px;
      padding: 20px;
      border: 2px dashed rgba(78, 205, 196, 0.3);
      border-radius: 10px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
    }

    .file-upload-area:hover {
      border-color: #4ecdc4;
      background: rgba(78, 205, 196, 0.05);
    }

    .file-upload-area.dragover {
      border-color: #4ecdc4;
      background: rgba(78, 205, 196, 0.1);
    }

    .file-upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .file-upload-text {
      color: #aaa;
      margin-bottom: 10px;
    }

    .file-upload-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .file-upload-btn:hover {
      transform: translateY(-2px);
    }

    .file-list {
      margin-top: 15px;
      text-align: left;
      max-height: 100px;
      overflow-y: auto;
    }

    .file-item {
      background: rgba(78, 205, 196, 0.1);
      border: 1px solid rgba(78, 205, 196, 0.3);
      border-radius: 5px;
      padding: 8px 12px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .input-methods {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .input-method {
      flex: 1;
      max-width: 400px;
    }

    .input-method h3 {
      color: #4ecdc4;
      font-size: 18px;
      margin-bottom: 15px;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>🎲 班级随机点名精灵</h1>
    </div>

    <div id="canvas-container"></div>

    <div id="instructions" class="instructions">
      <h2>欢迎使用！</h2>
      <p>这是一个3D魔法球随机点名系统</p>
      <p>学生姓名将显示在3D球面上，随机抽取后高亮显示</p>

      <div class="input-methods">
        <div class="input-method">
          <h3>📁 导入文件</h3>
          <div class="file-upload-area" id="file-upload-area">
            <div class="file-upload-icon">📂</div>
            <div class="file-upload-text">拖拽文件到此处，或</div>
            <button class="file-upload-btn" onclick="document.getElementById('file-input').click()">选择文件</button>
            <input type="file" id="file-input" accept=".csv,.txt" style="display: none" onchange="handleFileSelect(event)">
            <div id="file-list" class="file-list"></div>
          </div>
          <p style="color: #888; font-size: 12px; margin-top: 10px;">
            支持格式：CSV（逗号分隔）、TXT（每行一个姓名）
          </p>
        </div>

        <div class="input-method">
          <h3>✍️ 手动输入</h3>
          <div class="input-area">
            <p style="color: #4ecdc4; margin-bottom: 10px;">每行输入一个学生姓名：</p>
            <textarea id="student-input" placeholder="张三&#10;李四&#10;王五&#10;赵六"></textarea>
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <button class="btn btn-primary" onclick="startApp()">开始使用</button>
      </div>
    </div>

    <div class="controls">
      <div class="count-selector">
        <span style="color: white;">抽取人数：</span>
        <button class="count-btn active" onclick="selectCount(1)">1</button>
        <button class="count-btn" onclick="selectCount(2)">2</button>
        <button class="count-btn" onclick="selectCount(3)">3</button>
        <button class="count-btn" onclick="selectCount(4)">4</button>
        <button class="count-btn" onclick="selectCount(5)">5</button>
      </div>
      <button class="btn btn-primary" onclick="startRoll()" id="roll-btn">🎯 开始抽取</button>
      <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清空</button>
    </div>

    <div id="result-display" class="result-display">
      <div class="result-title">🎊 本次抽取结果</div>
      <div id="result-list" class="result-list"></div>
    </div>
  </div>

  <script>
    // 全局变量
    let scene, camera, renderer, animationId;
    let nameFragments = [];
    let students = [];
    let selectedCount = 1;
    let isRolling = false;

    // 文件处理相关变量
    let importedNames = [];

    // 处理文件选择
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        processFile(file);
      }
    }

    // 处理拖拽文件
    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('dragover');
    }

    function handleDragLeave(event) {
      event.preventDefault();
      event.currentTarget.classList.remove('dragover');
    }

    function handleDrop(event) {
      event.preventDefault();
      event.currentTarget.classList.remove('dragover');

      const file = event.dataTransfer.files[0];
      if (file) {
        processFile(file);
      }
    }

    // 处理文件
    function processFile(file) {
      const fileName = file.name;
      const fileExtension = fileName.split('.').pop().toLowerCase();

      if (fileExtension === 'csv') {
        processCSVFile(file);
      } else if (fileExtension === 'txt') {
        processTXTFile(file);
      } else {
        alert('不支持的文件格式！请选择CSV或TXT文件。');
      }
    }

    // 处理CSV文件
    function processCSVFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        const lines = content.split(/\r?\n/);
        const names = [];

        lines.forEach(line => {
          if (line.trim()) {
            // 处理逗号分隔的CSV
            const parts = line.split(',');
            if (parts[0]) {
              names.push(parts[0].trim());
            }
          }
        });

        importedNames = [...importedNames, ...names];
        displayImportedFiles(file.name, names.length);
      };
      reader.readAsText(file, 'UTF-8');
    }

    // 处理TXT文件
    function processTXTFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        const names = content.split(/\r?\n/)
          .map(name => name.trim())
          .filter(name => name);

        importedNames = [...importedNames, ...names];
        displayImportedFiles(file.name, names.length);
      };
      reader.readAsText(file, 'UTF-8');
    }

    // 显示导入的文件信息
    function displayImportedFiles(fileName, count) {
      const fileList = document.getElementById('file-list');
      const fileItem = document.createElement('div');
      fileItem.className = 'file-item';
      fileItem.textContent = `✅ ${fileName} - 成功导入 ${count} 个姓名`;
      fileList.appendChild(fileItem);

      // 自动填充到文本框
      const textArea = document.getElementById('student-input');
      const existingText = textArea.value.trim();
      const newText = importedNames.join('\n');
      textArea.value = existingText ? existingText + '\n' + newText : newText;
    }

    // 斐波那契球面分布算法
    function fibonacciSphere(count, radius) {
      const points = [];
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < count; i++) {
        const t = (i + 0.5) / count;
        const phi = Math.acos(1 - 2 * t);
        const theta = goldenAngle * i;

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);

        points.push({ x, y, z });
      }

      return points;
    }

    // 创建名字纹理
    function createNameTexture(name, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = color;

      ctx.fillText(name, canvas.width / 2, canvas.height / 2);

      return new THREE.CanvasTexture(canvas);
    }

    // 初始化Three.js
    function initThreeJS() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);

      camera = new THREE.PerspectiveCamera(
        75,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
      );
      camera.position.z = 8;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // 添加光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      // 创建星空背景
      createStarField();

      animate();
    }

    // 创建星空背景
    function createStarField() {
      const starsGeometry = new THREE.BufferGeometry();
      const starPositions = [];
      const starColors = [];

      for (let i = 0; i < 2000; i++) {
        const x = (Math.random() - 0.5) * 100;
        const y = (Math.random() - 0.5) * 100;
        const z = (Math.random() - 0.5) * 100;
        starPositions.push(x, y, z);

        const color = new THREE.Color();
        color.setHSL(Math.random() * 0.2 + 0.5, 0.7, 0.9);
        starColors.push(color.r, color.g, color.b);
      }

      starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      starsGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

      const starsMaterial = new THREE.PointsMaterial({
        size: 0.1,
        vertexColors: true,
        transparent: true,
        opacity: 0.8
      });

      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);
    }

    // 创建名字碎片
    function createNameFragments() {
      // 清除旧的碎片
      nameFragments.forEach(fragment => {
        scene.remove(fragment.mesh);
      });
      nameFragments = [];

      if (students.length === 0) return;

      const positions = fibonacciSphere(students.length, 3);
      const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#a29bfe'];

      students.forEach((student, index) => {
        const color = colors[index % colors.length];
        const texture = createNameTexture(student.name, color);

        const geometry = new THREE.PlaneGeometry(0.8, 0.4);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(geometry, material);
        const position = positions[index];
        mesh.position.set(position.x, position.y, position.z);

        // 随机旋转
        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;

        scene.add(mesh);

        nameFragments.push({
          student,
          mesh,
          isSelected: false,
          originalScale: { x: 1, y: 1, z: 1 }
        });
      });
    }

    // 动画循环
    function animate() {
      animationId = requestAnimationFrame(animate);

      // 旋转动画
      nameFragments.forEach((fragment, index) => {
        fragment.mesh.rotation.y += 0.01;
        fragment.mesh.rotation.x += 0.005;

        if (fragment.isSelected) {
          fragment.mesh.scale.set(1.5, 1.5, 1.5);
        } else {
          fragment.mesh.scale.set(1, 1, 1);
        }
      });

      renderer.render(scene, camera);
    }

    // 窗口大小调整
    function handleResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 开始抽取
    function startRoll() {
      if (students.length === 0 || isRolling) {
        alert('请先输入学生名单！');
        return;
      }

      isRolling = true;

      // 重置所有选中状态
      nameFragments.forEach(fragment => {
        fragment.isSelected = false;
      });

      // 随机选择学生
      const selected = [];
      const available = [...students];

      for (let i = 0; i < selectedCount && available.length > 0; i++) {
        const randomIndex = Math.floor(Math.random() * available.length);
        const selectedStudent = available.splice(randomIndex, 1)[0];
        selected.push(selectedStudent);
      }

      // 标记选中的学生
      selected.forEach(selectedStudent => {
        const fragment = nameFragments.find(f => f.student.name === selectedStudent.name);
        if (fragment) {
          fragment.isSelected = true;
        }
      });

      // 显示结果
      showResults(selected);

      isRolling = false;
    }

    // 显示结果
    function showResults(selectedStudents) {
      const resultDisplay = document.getElementById('result-display');
      const resultList = document.getElementById('result-list');

      resultList.innerHTML = '';
      selectedStudents.forEach(student => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.textContent = student.name;
        resultList.appendChild(item);
      });

      resultDisplay.classList.add('show');

      // 3秒后自动隐藏
      setTimeout(() => {
        resultDisplay.classList.remove('show');
      }, 3000);
    }

    // 清空结果
    function clearResults() {
      const resultDisplay = document.getElementById('result-display');
      resultDisplay.classList.remove('show');

      nameFragments.forEach(fragment => {
        fragment.isSelected = false;
      });
    }

    // 选择抽取人数
    function selectCount(count) {
      selectedCount = count;

      // 更新按钮状态
      document.querySelectorAll('.count-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    // 开始应用
    function startApp() {
      // 获取手动输入的名单
      const input = document.getElementById('student-input').value;
      const manualNames = input.split('\n').map(name => name.trim()).filter(name => name);

      // 合并文件导入的名单和手动输入的名单
      const allNames = [...importedNames, ...manualNames];

      // 去重
      const uniqueNames = allNames.filter((name, index, arr) => arr.indexOf(name) === index);

      if (uniqueNames.length === 0) {
        alert('请输入至少一个学生姓名或导入文件！');
        return;
      }

      students = uniqueNames.map((name, index) => ({
        id: index,
        name: name
      }));

      document.getElementById('instructions').classList.add('hidden');

      if (!scene) {
        initThreeJS();
      }

      createNameFragments();

      // 显示成功信息
      alert(`成功导入 ${uniqueNames.length} 个学生姓名！`);
    }

    // 页面加载完成后初始化
    window.addEventListener('load', () => {
      window.addEventListener('resize', handleResize);

      // 添加拖拽事件监听器
      const uploadArea = document.getElementById('file-upload-area');
      uploadArea.addEventListener('dragover', handleDragOver);
      uploadArea.addEventListener('dragleave', handleDragLeave);
      uploadArea.addEventListener('drop', handleDrop);
    });
  </script>

  <!-- 加载Three.js库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
</html>
